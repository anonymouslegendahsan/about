
name: Build About Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip make perl

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -o about.zip -d source
          echo "=== Extracted files ==="
          find source -maxdepth 7 -type f | sort | head -200

      - name: Locate tweak Makefile
        run: |
          FILE="$(find source -type f -name Makefile | head -n 1)"

          if [ -z "$FILE" ]; then
            echo "ERROR: No Makefile found in about.zip"
            echo "ZIP contents:"
            unzip -l about.zip | head -100
            exit 1
          fi

          echo "MAKEFILE_PATH=$FILE" >> "$GITHUB_ENV"
          echo "Tweak Makefile: $FILE"

      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Install Theos SDKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          cd /tmp

          curl -fL \
            https://github.com/theos/sdks/archive/refs/heads/master.zip \
            -o sdks.zip

          unzip -q -o sdks.zip

          echo "=== SDK folders found ==="
          find /tmp/sdks-master -maxdepth 1 -type d -name '*.sdk' -print

          find /tmp/sdks-master -maxdepth 1 -type d -name '*.sdk' \
            -exec cp -R {} "$GITHUB_WORKSPACE/theos/sdks/" \;

          echo "=== SDKs installed ==="
          ls -la "$GITHUB_WORKSPACE/theos/sdks"

          if ! find "$GITHUB_WORKSPACE/theos/sdks" -maxdepth 1 -type d -name '*.sdk' | grep -q .; then
            echo "ERROR: No SDK directories were installed."
            echo "Checking downloaded archive:"
            unzip -l /tmp/sdks.zip | head -80
            exit 1
          fi

      - name: Verify Theos
        run: |
          test -d "$THEOS/makefiles"
          test -d "$THEOS/sdks"
          echo "Theos path: $THEOS"
          echo "Theos and SDK folders verified."

      - name: Build About tweak
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          cd "$(dirname "$MAKEFILE_PATH")"

          echo "=== Building from ==="
          pwd

          echo "=== Makefile ==="
          cat Makefile

          make clean
          make package FINALPACKAGE=1

      - name: Locate compiled packages
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          find source -type f -name '*.deb' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          echo "=== Compiled packages ==="
          find "$GITHUB_WORKSPACE/output" -type f -name '*.deb'

          if ! find "$GITHUB_WORKSPACE/output" -type f -name '*.deb' | grep -q .; then
            echo "ERROR: No .deb package was generated."
            exit 1
          fi

      - name: Upload compiled packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: About-build
          path: output/*.deb
          if-no-files-found: error
